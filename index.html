<script src="js/main.js"></script>
<script>
(function () {
  var CODE = '1310';                       // change the passcode here
  var entered = '';
  var boxes = document.querySelectorAll('#boxes span');
  var msg = document.getElementById('msg');
  var panel = document.getElementById('panel');
  var unlock = document.getElementById('unlock');
  function draw() { boxes.forEach(function (b, i) { b.classList.toggle('on', i < entered.length); }); }
  function press(k) {
    if (!unlock.classList.contains('hidden')) return;
    if (k === '*') entered = '';
    else if (k === '#') entered = entered.slice(0, -1);
    else if (entered.length < 4) entered += k;
    msg.textContent = '';
    draw();
    if (entered.length === 4) {
      if (entered === CODE) {
        msg.textContent = 'Yay, that is it!';
        unlock.classList.remove('hidden');
        unlock.focus();
      } else {
        msg.textContent = 'Nope! Try again, birthday girl';
        panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake');
        entered = ''; setTimeout(draw, 300);
      }
    }
  }
  document.querySelectorAll('#keys button').forEach(function (b) {
    b.addEventListener('click', function () { press(b.textContent); });
  });
  document.addEventListener('keydown', function (e) {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('#');
  });
})();
</script>

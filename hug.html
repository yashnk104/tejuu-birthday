<div class="load-box" style="width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px">

  <div class="loadbar"><div></div></div>
</div>
<div class="done-box popin" aria-live="polite">
  <h1>Hug delivered!<br>Happy birthday, Tejuu</h1>
  <div class="row" style="gap:16px">
    <button class="pill" type="button" id="again">Another hug</button>
    <a class="pill light" href="index.html">Start over</a>
  </div>
</div>
</main>
<script src="js/main.js"></script>
<script>
(function () {
  var b = document.body, timer;
  function start() {
    b.classList.remove('done', 'loading'); void b.offsetWidth; b.classList.add('loading');
    clearTimeout(timer);
    timer = setTimeout(function () { b.classList.remove('loading'); b.classList.add('done'); }, 4200);
  }
  document.getElementById('again').onclick = start;
  start();
})();
</script>
